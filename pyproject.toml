[project]
name = "incident-triage"
version = "0.1.0"
description = "Evidence-grounded incident triage copilot: logs counted, runbooks retrieved, every claim cited and verified."
requires-python = ">=3.11"
# Base dependencies only. Each member adds what their module needs with `uv add <pkg>`
# in their own PR, after stating why (see CLAUDE.md, vibe-coding guardrails).
dependencies = [
    "fastapi>=0.110",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "streamlit>=1.35",
    "typer>=0.12",
    "uvicorn>=0.29",
]

[project.scripts]
triage = "triage.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triage"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Code blocks in docs are illustrative; keep ruff away from Markdown.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as default values; that is intended, not a bug.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
