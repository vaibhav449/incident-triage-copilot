# Minimal CI from the repo skeleton. Owner from here on: Member 3 (adds contract tests and the smoke eval).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (fails if uv.lock is out of date)
        run: uv sync --locked
      - name: Lint, format check, tests
        run: make check
